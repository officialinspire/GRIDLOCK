name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and Pages checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CPU robustness sweep (all modes, no illegal actions or stalls)
        run: npm run simulate:cpu -- --games 104 --mode all

  browser:
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:smoke
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Offline / PWA checks
        if: ${{ !cancelled() }}
        run: npm run test:pwa
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
