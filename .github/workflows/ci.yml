name: CI

# One run per commit: pull requests are tested on their own event, and a push is tested only on
# main (what GitHub Pages publishes). Pushing to a pull request's branch used to run everything
# twice, so every failure was reported twice. "Run workflow" on the Actions tab runs it by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer commit on the same pull request or branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and Pages checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CPU robustness sweep (all modes, no illegal actions or stalls)
        run: npm run simulate:cpu -- --games 104 --mode all

  browser:
    name: Browser smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:smoke
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Offline / PWA checks
        if: ${{ !cancelled() }}
        run: npm run test:pwa
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
